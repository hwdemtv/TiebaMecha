[project]
name = "tieba-mecha"
version = "1.3.0"
description = "Cyber-Mecha style Baidu Tieba management tool with CLI and Web UI"
authors = [{ name = "Developer" }]
requires-python = ">=3.10,<3.15"
dependencies = [
    # 代理注入（core/client_factory.py）依赖 aiotieba 4.6.x 的内部结构；不锁上界时，
    # 升级带来的结构变化会让代理悄悄失效而无人察觉（2026-11-24 体检的起因）
    "aiotieba>=4.6.4,<5",
    "flet==0.23.2",
    "typer>=0.9.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19.0",
    "apscheduler>=3.10",
    "cryptography>=41.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0",  # 显式声明依赖
    "aiohttp_socks>=0.8.0",
    "httpx>=0.25.0",  # link_manager 直接引用
    "socksio",        # SOCKS 代理支持
    "rich>=13.0",     # CLI 美化输出
    "pydantic>=2.0",  # 数据模型校验
    # 以下三个此前靠 flet 间接带入，但 start_web.py / web/downloads.py 直接 import 它们；
    # flet 一旦调整自身依赖就会断，故显式声明（2026-11-24）
    "uvicorn>=0.42",
    "fastapi>=0.135",
    "starlette>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
]

[project.scripts]
tieba = "tieba_mecha.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tieba_mecha"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "A", "C4", "FA", "PT", "ASYNC"]
ignore = ["A005", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
