services:
  tieba-mecha:
    build: .
    image: hwdemtv/tieba-mecha:latest
    container_name: tieba-mecha
    restart: always
    ports:
      - "9006:9006"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      # 凭据加密密钥：从宿主机环境变量或同目录 .env 透传（缺失时容器内首次加密会报错）
      - TIEBA_MECHA_SALT=${TIEBA_MECHA_SALT:-}
      - TIEBA_MECHA_SECRET_KEY=${TIEBA_MECHA_SECRET_KEY:-}
      # 如果需要指定自定义端口，可以启用下方设置
      # - PORT=9006
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9006')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
